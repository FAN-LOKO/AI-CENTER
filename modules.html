<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Модули</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="page page-my-agent">
    <section class="card-section">
      <div class="card-section-header">
        <h2 class="card-section-title">Модули сервиса</h2>
        <p class="card-section-subtitle">
          Выберите инструмент для работы, обучения, контента и роста команды
        </p>
      </div>

      <div class="card-section-body modules-summary-body">
        <div class="profile-row">
          <span class="profile-label">Статус модулей</span>
          <span class="profile-value" id="subscriptionStatusLabel">
            Сейчас открыты 3 модуля: базовый модуль Агента и 2 бесплатных модуля.<br>
            Остальные модули показаны в каталоге как витрина и отмечены статусом «В разработке».
          </span>
        </div>
      </div>
    </section>

    <div id="modulesList"></div>
  </div>

  <script>
    /* =========================================================
     * PAGE STATE
     * Что здесь:
     * - tenant config страницы
     * - feature flags
     * - fallback route для модулей без страницы
     * - tenant catalog модулей
     * - user access map по модулям
     * - флаг готовности страницы
     * - список реально доступных модулей
     * ========================================================= */

    let TENANTCONFIG = null;
    let APPFEATURES = {
      home: true,
      myAgent: true,
      modules: true,
      sharedChat: true,
      affiliate: true,
      payments: true,
      settings: true
    };

    const MODULE_FALLBACK_PAGE = 'module-coming-soon.html';

    let TENANTMODULES = [];
    let USERMODULEACCESS = {};
    let _modulesReady = false;

    const AVAILABLE_MODULE_IDS = ['ai-agent', 'knowledge-hub', 'support-desk'];
    const BASE_MODULE_IDS = ['ai-agent'];
    const FREE_MODULE_IDS = ['knowledge-hub', 'support-desk'];

    const VPN_PARTNER_CARD = {
      id: 'partner-vpn',
      title: 'VPN',
      titleRu: 'Доступ к Telegram и соцсетям',
      shortDescription: 'Внешний сервис партнёра для стабильного доступа к Telegram и другим соцсетям в регионах с ограничениями.',
      fullDescription: [
        'Помогает сохранить стабильный доступ к Telegram и другим важным каналам связи.',
        'Подходит для пользователей из регионов, где Telegram и отдельные соцсети могут работать нестабильно.',
        'Предоставляется внешним партнёром и открывается по внешней ссылке.'
      ],
      page: null,
      enabled: true,
      category: 'external',
      requiresPayment: false,
      isExternalService: true,
      externalUrl: 'https://YOUR-PARTNER-VPN-LINK'
    };

    /* =========================================================
     * SHELL HELPERS
     * Что здесь:
     * - чтение tenant config из shell
     * - чтение текстов из tenant config
     * - чтение tenant modules из shell
     * ========================================================= */

    function getTenantConfig() {
      try {
        return window.parent?.AICAppShell?.getTenantConfig?.() || null;
      } catch (error) {
        console.error('[AI CENTER][Modules] tenant config read failed', error);
        return null;
      }
    }

    function getText(key, fallback = '') {
      return TENANTCONFIG?.texts?.[key] ?? fallback;
    }

    function getTenantModulesRaw() {
      const fallbackModules = [
        {
          id: 'ai-agent',
          title: 'Agent Connection',
          titleRu: 'Подключение Агента',
          shortDescription: 'Подключение и управление ИИ-агентом для диалогов и первичной квалификации.',
          fullDescription: [
            'Подключение соцсетей и каналов общения, включая Telegram и другие площадки.',
            'Готовый ИИ-агент на платформенной модели без настройки API со стороны пользователя.',
            'Обработка входящих сообщений, первичный рекрутинг и квалификация обращений.',
            'История диалогов и возможность ручного вмешательства в общение.',
            'Базовая статистика по диалогам, обращениям и лидам.'
          ],
          page: 'modules-agent/profile.html',
          enabled: true,
          category: 'base',
          requiresPayment: false
        },
        {
          id: 'knowledge-hub',
          title: 'Knowledge Hub',
          titleRu: 'База знаний',
          shortDescription: 'Материалы, обучение и AI-поиск по знаниям компании, продукта и процессов.',
          fullDescription: [
            'Материалы по продукту, бизнес-модели, скриптам, возражениям, презентациям и эфирам.',
            'Обучающие дорожки для разных ролей: новичок, партнёр, лидер.',
            'AI-поиск по базе знаний и быстрый доступ к нужным материалам.',
            'Привязка материалов к другим модулям платформы.'
          ],
          page: 'modules-knowledge-hub.html',
          enabled: true,
          category: 'free',
          requiresPayment: false
        },
        {
          id: 'support-desk',
          title: 'Support Desk',
          titleRu: 'Центр поддержки',
          shortDescription: 'Поддержка, обращения, сервисные вопросы и сопровождение пользователей.',
          fullDescription: [
            'Единая точка входа для сервисных запросов.',
            'Помощь по onboarding, оплатам и доступам.',
            'Передача обращений в поддержку и контроль статуса.',
            'База быстрых ответов по типовым вопросам.'
          ],
          page: 'modules-support-desk.html',
          enabled: true,
          category: 'free',
          requiresPayment: false
        },
        {
          id: 'media-lab',
          title: 'Media Lab',
          titleRu: 'Медиа Лаб',
          shortDescription: 'Инструменты для создания контента, упаковки офферов и материалов для продвижения.',
          fullDescription: [
            'Генерация и упаковка контента для соцсетей и рассылок.',
            'Шаблоны офферов, прогревов, постов и сторис.',
            'Подготовка материалов для личного бренда и командного маркетинга.',
            'Модуль планируется к запуску в следующих релизах.'
          ],
          page: MODULE_FALLBACK_PAGE,
          enabled: true,
          category: 'optional',
          requiresPayment: true
        },
        {
          id: 'team-space',
          title: 'Team Space',
          titleRu: 'Командный центр',
          shortDescription: 'Пространство для совместной работы команды, управления задачами и внутренней координации.',
          fullDescription: [
            'Общий центр командных задач и ролей.',
            'Внутренние заметки, распределение процессов и чек-листов.',
            'Быстрый обзор активности команды и внутренних действий.',
            'Модуль планируется к запуску в следующих релизах.'
          ],
          page: MODULE_FALLBACK_PAGE,
          enabled: true,
          category: 'optional',
          requiresPayment: true
        },
        {
          id: 'academy',
          title: 'Academy',
          titleRu: 'Академия',
          shortDescription: 'Система обучения, треков развития и маршрутов роста для новичков и лидеров.',
          fullDescription: [
            'Пошаговые программы обучения для разных ролей.',
            'Маршруты адаптации новичков и роста партнёров.',
            'Материалы, задания и контроль прохождения.',
            'Модуль планируется к запуску в следующих релизах.'
          ],
          page: MODULE_FALLBACK_PAGE,
          enabled: true,
          category: 'optional',
          requiresPayment: true
        },
        {
          id: 'analytics',
          title: 'Analytics',
          titleRu: 'Аналитика',
          shortDescription: 'Сводки, отчёты и ключевые показатели по активности, заявкам, лидам и оплатам.',
          fullDescription: [
            'Единая витрина метрик по обращениям, диалогам и действиям.',
            'Сводка ключевых показателей по команде и воронке.',
            'Панели для анализа роста и эффективности.',
            'Модуль планируется к запуску в следующих релизах.'
          ],
          page: MODULE_FALLBACK_PAGE,
          enabled: true,
          category: 'optional',
          requiresPayment: true
        }
      ];

      try {
        const raw = window.parent?.AICAppShell?.getTenantModules?.();

        if (Array.isArray(raw) && raw.length) {
          const merged = [...raw];

          fallbackModules.forEach(fallbackModule => {
            const exists = merged.some(module => module && module.id === fallbackModule.id);
            if (!exists) {
              merged.push(fallbackModule);
            }
          });

          return merged;
        }

        return fallbackModules;
      } catch (error) {
        console.error('[AI CENTER][Modules] tenant modules read failed', error);
        return fallbackModules;
      }
    }

    /* =========================================================
     * MODULE CATALOG HELPERS
     * Что здесь:
     * - определение route модуля
     * - нормализация user access map
     * - получение полного каталога модулей tenant
     * - ожидание загрузки tenant modules из shell
     * - сортировка модулей по приоритету
     * ========================================================= */

    function getModuleRoute(module) {
      if (!module) return MODULE_FALLBACK_PAGE;
      return module.page || MODULE_FALLBACK_PAGE;
    }

    function normalizeAccessMap(raw) {
      if (!raw || typeof raw !== 'object') return {};
      return raw;
    }

    function getModuleSortWeight(moduleId) {
      const order = [
        'ai-agent',
        'partner-vpn',
        'knowledge-hub',
        'support-desk',
        'media-lab',
        'team-space',
        'academy',
        'analytics'
      ];

      const index = order.indexOf(moduleId);
      return index === -1 ? 999 : index;
    }

    function getTenantModules() {
      try {
        const shellModules = getTenantModulesRaw();
        const modulesWithPartnerCard = [...shellModules];
        const baseModuleIndex = modulesWithPartnerCard.findIndex(module => module && module.id === 'ai-agent');

        if (!modulesWithPartnerCard.some(module => module && module.id === VPN_PARTNER_CARD.id)) {
          if (baseModuleIndex !== -1) {
            modulesWithPartnerCard.splice(baseModuleIndex + 1, 0, VPN_PARTNER_CARD);
          } else {
            modulesWithPartnerCard.unshift(VPN_PARTNER_CARD);
          }
        }

        return modulesWithPartnerCard
          .filter(module => module && module.enabled !== false)
          .map(module => ({
            id: module.id,
            title: module.title || module.titleRu || module.id,
            titleRu: module.titleRu || module.title || module.id,
            shortDescription:
              module.shortDescription ||
              getText('modulesDefaultShortDescription', 'Описание модуля будет заполнено в tenant-конфиге.'),
            fullDescription:
              Array.isArray(module.fullDescription) && module.fullDescription.length
                ? module.fullDescription
                : [getText('modulesDefaultFullDescription', 'Описание модуля будет добавлено позже.')],
            page: getModuleRoute(module),
            requiresPayment: !!module.requiresPayment,
            category: module.category || 'optional',
            isExternalService: !!module.isExternalService,
            externalUrl: typeof module.externalUrl === 'string' ? module.externalUrl : null
          }))
          .sort((a, b) => getModuleSortWeight(a.id) - getModuleSortWeight(b.id));
      } catch (error) {
        console.error('[AI CENTER][Modules] catalog normalize failed', error);
        return [];
      }
    }

    function waitForTenantModules(maxAttempts = 20, delay = 150) {
      return new Promise(resolve => {
        let attempts = 0;

        const tick = () => {
          const modules = getTenantModules();
          if (modules.length || attempts >= maxAttempts) {
            resolve(modules);
            return;
          }

          attempts += 1;
          setTimeout(tick, delay);
        };

        tick();
      });
    }

    /* =========================================================
     * ACCESS HELPERS
     * Что здесь:
     * - проверка доступа к модулю
     * - статус доступности карточки
     * - текст статуса каталога
     * - бейдж карточки
     * ========================================================= */

    function hasModuleAccess(moduleId) {
      return !!USERMODULEACCESS[moduleId]?.paid || AVAILABLE_MODULE_IDS.includes(moduleId);
    }

    function isModuleAvailable(module) {
      if (!module) return false;
      if (module.isExternalService) return true;
      return hasModuleAccess(module.id);
    }

    function getCatalogStatusText() {
      const availableCount = TENANTMODULES.filter(module => isModuleAvailable(module)).length;
      return `Сейчас открыты ${availableCount} модуля: базовый модуль Агента и 2 бесплатных модуля.\nОстальные модули показаны в каталоге как витрина и отмечены статусом «В разработке».`;
    }

    function getModuleBadge(module) {
      if (!module) return { text: 'В разработке', className: 'planned' };

      if (module.isExternalService) {
        return { text: 'Внешний сервис', className: 'external' };
      }

      if (BASE_MODULE_IDS.includes(module.id)) {
        return { text: 'Базовый модуль', className: 'required' };
      }

      if (FREE_MODULE_IDS.includes(module.id)) {
        return { text: 'Бесплатно', className: 'free' };
      }

      if (isModuleAvailable(module)) {
        return { text: 'Доступен', className: 'paid' };
      }

      return { text: 'В разработке', className: 'planned' };
    }

    /* =========================================================
     * ACTIONS
     * Что здесь:
     * - открытие модуля
     * - переход на fallback
     * - работа с внешними сервисами
     * ========================================================= */

    function navigateTo(page) {
      if (!page) return;
      try {
        window.parent?.postMessage({ type: 'navigate', page }, '*');
      } catch (error) {
        console.error('[AI CENTER][Modules] navigate failed', error);
      }
    }

    function handleModuleOpen(module) {
      if (!module) return;

      if (module.isExternalService && module.externalUrl) {
        window.open(module.externalUrl, '_blank', 'noopener,noreferrer');
        return;
      }

      const route = getModuleRoute(module);
      navigateTo(route);
    }

    /* =========================================================
     * CARD RENDERING
     * Что здесь:
     * - создание одной module-card
     * - accordion поведение
     * - статусы и кнопки
     * ========================================================= */

    function createModuleCard(module) {
      const badge = getModuleBadge(module);
      const isAvailable = isModuleAvailable(module);

      const card = document.createElement('section');
      card.className = 'accordion-card module-card';

      const header = document.createElement('button');
      header.className = 'accordion-header module-card-toggle';
      header.type = 'button';
      header.setAttribute('aria-expanded', 'false');

      const titleWrap = document.createElement('div');
      titleWrap.className = 'module-card-header-main';

      const title = document.createElement('div');
      title.className = 'module-card-title';
      title.textContent = module.title || module.titleRu || 'Модуль';

      const titleRu = document.createElement('div');
      titleRu.className = 'module-card-title-ru';
      titleRu.textContent = module.titleRu || module.title || '';

      titleWrap.appendChild(title);
      if (titleRu.textContent && titleRu.textContent !== title.textContent) {
        titleWrap.appendChild(titleRu);
      }

      const badgeNode = document.createElement('span');
      badgeNode.className = `module-card-badge ${badge.className}`;
      badgeNode.textContent = badge.text;

      const icon = document.createElement('span');
      icon.className = 'accordion-header-icon';
      icon.setAttribute('aria-hidden', 'true');

      header.appendChild(titleWrap);
      header.appendChild(badgeNode);
      header.appendChild(icon);

      const body = document.createElement('div');
      body.className = 'accordion-body module-card-expanded';

      const shortDescription = document.createElement('p');
      shortDescription.className = 'module-card-short-description';
      shortDescription.textContent = module.shortDescription || '';

      const descriptionList = document.createElement('ul');
      descriptionList.className = 'module-card-description-list';

      (module.fullDescription || []).forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        descriptionList.appendChild(li);
      });

      const button = document.createElement('button');
      button.className = 'btn';
      button.type = 'button';
      button.textContent = module.isExternalService
        ? 'Перейти к сервису'
        : (isAvailable ? 'Открыть модуль' : 'Подробнее');

      button.addEventListener('click', event => {
        event.stopPropagation();
        handleModuleOpen(module);
      });

      body.appendChild(shortDescription);
      body.appendChild(descriptionList);
      body.appendChild(button);

      header.addEventListener('click', () => {
        const isOpen = card.classList.toggle('open');
        header.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });

      card.appendChild(header);
      card.appendChild(body);

      return card;
    }

    /* =========================================================
     * PAGE RENDERING
     * Что здесь:
     * - отрисовка общей витрины модулей
     * - empty/disabled state
     * - обновление summary строки
     * ========================================================= */

    function renderModulesList() {
      const modulesList = document.getElementById('modulesList');
      const subscriptionStatusLabel = document.getElementById('subscriptionStatusLabel');

      if (subscriptionStatusLabel) {
        subscriptionStatusLabel.textContent = getCatalogStatusText();
      }

      if (!modulesList) return;

      modulesList.innerHTML = '';

      if (APPFEATURES.modules === false) {
        modulesList.innerHTML = `
          <section class="card-section">
            <div class="card-section-body modules-empty-state">
              <p class="module-card-short-description">
                ${getText('modulesDisabledText', 'Раздел модулей сейчас недоступен.')}
              </p>
            </div>
          </section>
        `;
        return;
      }

      if (!TENANTMODULES.length) {
        modulesList.innerHTML = `
          <section class="card-section">
            <div class="card-section-body modules-empty-state">
              <p class="module-card-short-description">
                ${getText('modulesEmptyText', 'Для этого tenant пока не настроен список модулей.')}
              </p>
            </div>
          </section>
        `;
        return;
      }

      TENANTMODULES.forEach(module => {
        modulesList.appendChild(createModuleCard(module));
      });
    }

    /* =========================================================
     * SHELL SYNC
     * Что здесь:
     * - чтение стартовых данных из shell
     * - подписка на postMessage обновления
     * ========================================================= */

    async function syncFromShell() {
      TENANTCONFIG = getTenantConfig();

      try {
        const shellFeatures = window.parent?.AICAppShell?.getAppFeatures?.();
        if (shellFeatures && typeof shellFeatures === 'object') {
          APPFEATURES = { ...APPFEATURES, ...shellFeatures };
        }
      } catch (error) {
        console.error('[AI CENTER][Modules] feature flags read failed', error);
      }

      try {
        const rawUserModules = window.parent?.AICAppShell?.getUserModules?.() || [];
        USERMODULEACCESS = normalizeAccessMap(
          rawUserModules.reduce((acc, item) => {
            if (item?.id) acc[item.id] = item;
            return acc;
          }, {})
        );
      } catch (error) {
        console.error('[AI CENTER][Modules] user modules read failed', error);
        USERMODULEACCESS = {};
      }

      TENANTMODULES = await waitForTenantModules();
      _modulesReady = true;
      renderModulesList();
    }

    window.addEventListener('message', event => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'tenant-config') {
        TENANTCONFIG = data.config || null;
        if (_modulesReady) renderModulesList();
        return;
      }

      if (data.type === 'tenant-modules') {
        TENANTMODULES = getTenantModules();
        _modulesReady = true;
        renderModulesList();
        return;
      }

      if (data.type === 'app-features') {
        APPFEATURES = { ...APPFEATURES, ...(data.features || {}) };
        if (_modulesReady) renderModulesList();
        return;
      }

      if (data.type === 'user-modules') {
        USERMODULEACCESS = normalizeAccessMap(
          Array.isArray(data.modules)
            ? data.modules.reduce((acc, item) => {
                if (item?.id) acc[item.id] = item;
                return acc;
              }, {})
            : {}
        );

        if (_modulesReady) renderModulesList();
      }
    });

    syncFromShell();
  </script>
</body>
</html>
